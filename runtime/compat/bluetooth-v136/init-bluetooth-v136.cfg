{
  "services": [
    {
      "name": "sheng_bluetooth_hdi",
      "path": [
        "/compat/bin/native_bt_hdi_publisher_v136",
        "--serve"
      ],
      "uid": "blue_host",
      "gid": [
        "blue_host",
        "bluetooth",
        "system",
        "log"
      ],
      "caps": [
        "BLOCK_SUSPEND",
        "SYS_NICE"
      ],
      "secon": "u:r:blue_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "env": [
        {
          "name": "LD_LIBRARY_PATH",
          "value": "/compat/bluetooth-v136/ohos:/system/lib64:/vendor/lib64"
        }
      ],
      "start-mode": "condition"
    },
    {
      "name": "bluetooth_service",
      "path": [
        "/system/bin/sa_main",
        "/compat/etc/bluetooth_service_v136.json"
      ],
      "uid": "bluetooth",
      "gid": [
        "bluetooth",
        "shell",
        "wakelock",
        "uhid",
        "radio"
      ],
      "caps": [
        "CAP_NET_ADMIN",
        "CAP_SYS_NICE",
        "CAP_WAKE_ALARM",
        "CAP_BLOCK_SUSPEND"
      ],
      "secon": "u:r:bluetooth_service:s0",
      "permission": [
        "ohos.permission.MODIFY_AUDIO_SETTINGS",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.PLACE_CALL",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.ANSWER_CALL",
        "ohos.permission.READ_MESSAGES",
        "ohos.permission.SEND_MESSAGES",
        "ohos.permission.RECEIVE_SMS",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.SET_TELEPHONY_STATE",
        "ohos.permission.GET_WIFI_INFO",
        "ohos.permission.GET_WIFI_INFO_INTERNAL",
        "ohos.permission.SET_WIFI_CONFIG",
        "ohos.permission.GET_WIFI_CONFIG",
        "ohos.permission.MANAGE_WIFI_HOTSPOT",
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.ACCESS_SYSTEM_SETTINGS",
        "ohos.permission.RECEIVE_UPDATE_MESSAGE",
        "ohos.permission.MANAGE_MEDIA_RESOURCES",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.GET_BUNDLE_INFO",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.READ_CALL_LOG",
        "ohos.permission.READ_CONTACTS",
        "ohos.permission.ABILITY_BACKGROUND_COMMUNICATION",
        "ohos.permission.RECEIVER_STARTUP_COMPLETED",
        "ohos.permission.ACCESS_SERVICE_DM",
        "ohos.permission.REPORT_SECURITY_EVENT",
        "ohos.permission.MANAGE_AUDIO_CONFIG",
        "ohos.permission.MANAGE_BLUETOOTH",
        "ohos.permission.NETWORK_DHCP",
        "ohos.permission.CONNECTIVITY_INTERNAL",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
        "ohos.permission.PERCEIVE_SMART_POWER_SCENARIO",
        "ohos.permission.CROSS_OS_INTERCONNECT"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "sheng_bluetooth_check",
      "path": [
        "/compat/bin/native_bt_host_check_v139",
        "--service"
      ],
      "uid": "shell",
      "gid": [
        "shell"
      ],
      "apl": "system_core",
      "permission": [
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.MANAGE_BLUETOOTH"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "fusion_connectivity_manager_ext",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/fusion_connectivity_manager_ext.json"
      ],
      "uid": "fusion_connectivity_manager_ext",
      "gid": [
        "fusion_connectivity_manager_ext",
        "shell"
      ],
      "once": 1,
      "caps": [
        "CAP_NET_ADMIN",
        "CAP_SYS_NICE",
        "CAP_WAKE_ALARM",
        "CAP_BLOCK_SUSPEND"
      ],
      "secon": "u:r:fusion_connectivity_manager_ext:s0",
      "permission": [
        "ohos.permission.ACCESS_NEARLINK",
        "ohos.permission.MANAGE_NEARLINK",
        "ohos.permission.GET_NEARLINK_PEER_MAC",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.MANAGE_BLUETOOTH",
        "ohos.permission.GET_BLUETOOTH_PEERS_MAC",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.INPUT_MONITORING",
        "ohos.permission.POWER_OPTIMIZATION",
        "ohos.permission.vehicle.VEHICLE_POWER"
      ],
      "disabled": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "softbus_server",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/softbus_server.json"
      ],
      "uid": "dsoftbus",
      "gid": [
        "dsoftbus",
        "system",
        "shell",
        "netsys_socket"
      ],
      "secon": "u:r:softbus_server:s0",
      "permission": [
        "ohos.permission.MANAGE_NEARLINK",
        "ohos.permission.ACCESS_NEARLINK",
        "ohos.permission.GET_NEARLINK_LOCAL_MAC",
        "ohos.permission.GET_NEARLINK_PEER_MAC",
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.RECEIVER_STARTUP_COMPLETED",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.READ_DFX_SYSEVENT",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.MANAGE_VPN",
        "ohos.permission.MANAGE_NET_STRATEGY",
        "ohos.permission.INTERNET",
        "ohos.permission.GET_NETWORK_STATS",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.CONNECTIVITY_INTERNAL",
        "ohos.permission.MANAGE_DISTRIBUTED_ACCOUNTS",
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.GET_DISTRIBUTED_ACCOUNTS",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.ACCESS_SERVICE_DP",
        "ohos.permission.MANAGE_BLUETOOTH",
        "ohos.permission.GET_BLUETOOTH_LOCAL_MAC",
        "ohos.permission.GET_WIFI_INFO",
        "ohos.permission.SET_WIFI_INFO",
        "ohos.permission.GET_WIFI_LOCAL_MAC",
        "ohos.permission.GET_WIFI_CONFIG",
        "ohos.permission.SET_WIFI_CONFIG",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.GET_WIFI_INFO_INTERNAL",
        "ohos.permission.GET_WIFI_PEERS_MAC",
        "ohos.permission.MANAGE_WIFI_CONNECTION",
        "ohos.permission.ACCESS_IDS",
        "ohos.permission.sec.ACCESS_UDID",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.ACCESS_DEVAUTH_CRED_PRIVILEGE",
        "ohos.permission.MANAGE_USB_CONFIG",
        "ohos.permission.QUERY_SECURITY_MODEL_RESULT",
        "ohos.permission.LOCATION",
        "ohos.permission.ABILITY_BACKGROUND_COMMUNICATION",
        "ohos.permission.RECEIVE_UPDATE_MESSAGE",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.DEVICE_STANDBY_EXEMPTION"
      ],
      "permission_acls": [
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.GET_WIFI_INFO_INTERNAL",
        "ohos.permission.GET_WIFI_PEERS_MAC",
        "ohos.permission.MANAGE_WIFI_CONNECTION",
        "ohos.permission.ACCESS_IDS",
        "ohos.permission.ACCESS_DEVAUTH_CRED_PRIVILEGE"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    }
  ],
  "jobs": [
    {
      "name": "param:sheng-bluetooth-v136",
      "condition": "sheng.debug.start.bluetooth=true",
      "cmds": [
        "start sheng_bluetooth_hdi",
        "start bluetooth_service",
        "start fusion_connectivity_manager_ext",
        "mkdir /data/service/el1/public/dsoftbus 0771 dsoftbus dsoftbus",
        "mkdir /data/service/el1/public/database/dsoftbus 02770 dsoftbus ddms",
        "start softbus_server"
      ]
    },
    {
      "name": "param:sheng-bluetooth-check",
      "condition": "sheng.debug.bluetooth.check=true",
      "cmds": [
        "start sheng_bluetooth_check"
      ]
    }
  ]
}
