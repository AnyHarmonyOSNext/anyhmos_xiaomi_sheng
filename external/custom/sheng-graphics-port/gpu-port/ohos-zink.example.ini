[binaries]
c = ['/opt/anyharmonyos-deps/ohos-sdk/native/llvm/bin/clang', '--target=aarch64-linux-ohos']
cpp = ['/opt/anyharmonyos-deps/ohos-sdk/native/llvm/bin/clang++', '--target=aarch64-linux-ohos']
ar = '/opt/anyharmonyos-deps/ohos-sdk/native/llvm/bin/llvm-ar'
strip = '/opt/anyharmonyos-deps/ohos-sdk/native/llvm/bin/llvm-strip'
c_ld = 'lld'
cpp_ld = 'lld'
pkg-config = 'pkg-config'
[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['/opt/anyharmonyos-deps/stage/lib/pkgconfig']
[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'

[built-in options]
c_args = ['-DVK_USE_PLATFORM_OHOS', '-I/opt/anyharmonyos-deps/source/drivers_peripheral/display/interfaces/include', '-I/opt/anyharmonyos-deps/ohos-sdk/native/sysroot/usr/include/native_window', '-I/opt/anyharmonyos-deps/source/hiviewdfx_hilog/interfaces/native/innerkits/include']
c_link_args = ['/opt/anyharmonyos-deps/rom/system/lib64/chipset-sdk-sp/libnative_buffer.so', '/opt/anyharmonyos-deps/rom/system/lib64/chipset-sdk-sp/libnative_window.so', '/opt/anyharmonyos-deps/rom/system/lib64/chipset-sdk-sp/libhilog.so']
cpp_args = ['-DVK_USE_PLATFORM_OHOS', '-I/opt/anyharmonyos-deps/source/drivers_peripheral/display/interfaces/include', '-I/opt/anyharmonyos-deps/ohos-sdk/native/sysroot/usr/include/native_window', '-I/opt/anyharmonyos-deps/source/hiviewdfx_hilog/interfaces/native/innerkits/include', '-include', '/opt/AnyHarmonyOS/sm8650/graphics-port/tests/platform_cpp_config.h']
cpp_link_args = ['/opt/anyharmonyos-deps/rom/system/lib64/chipset-sdk-sp/libnative_buffer.so', '/opt/anyharmonyos-deps/rom/system/lib64/chipset-sdk-sp/libnative_window.so', '/opt/anyharmonyos-deps/rom/system/lib64/chipset-sdk-sp/libhilog.so', '-nostdlib++', '/opt/anyharmonyos-deps/rom/system/lib64/chipset-sdk-sp/libc++.so']
