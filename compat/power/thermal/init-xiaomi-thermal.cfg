{
  "jobs": [
    {
      "name": "param:sheng-start-xiaomi-thermal",
      "condition": "sheng.debug.start.thermal=true",
      "cmds": [
        "start sheng_xiaomi_thermal"
      ]
    }
  ],
  "services": [
    {
      "name": "sheng_xiaomi_thermal",
      "path": [
        "/compat/bin/native_thermal_launcher",
        "/data/local/tmp/sheng-xiaomi-thermal/root"
      ],
      "uid": "root",
      "gid": [
        "root"
      ],
      "caps": [
        "SYS_CHROOT"
      ],
      "disabled": 1,
      "once": 0,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    }
  ]
}
