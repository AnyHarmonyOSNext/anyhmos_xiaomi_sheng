{
  "jobs": [
    {
      "name": "services:hmos_fusion_manager",
      "cmds": [
        "mkdir /data/virt_service 0701 root root",
        "mkdir /data/virt_service/rgm_hmos 0701 root root",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/keystore",
        "mkdir /data/virt_service/anco_decoupling 0755 hmos_fusion_manager hmos_fusion_manager",
        "restorecon /data/virt_service/rgm_hmos",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_data",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_cache",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_cache",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/container",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_data/container",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/container/clone",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_data/container/clone",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/container/clone_data",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_data/container/clone_data",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/container/backup",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_data/container/backup",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/container/backup_data",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_data/container/backup_data",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/container/hisuite",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_data/container/hisuite",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/container/hisuite_data",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_data/container/hisuite_data",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_log/ 0775 root system",
        "restorecon /data/virt_service/rgm_hmos/anco_hmos_log",
        "mkdir /data/service/el1/public/hmos_fusion_manager 0711 hmos_fusion_manager hmos_fusion_manager",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/cota 0775 system system",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/cota/anco 0755 hmos_fusion_manager hmos_fusion_manager",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/cota/anco_sdk 0755 hmos_fusion_manager hmos_fusion_manager",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/settings 0755 system system",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/settings/users 0755 system system",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/cota/anco_dms 0755 system system",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/cota/anco_dms/logicCamera 0755 system system",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/cota/anco_dms/logicCamera/lap 0755 system system",
        "mkdir /data/virt_service/rgm_hmos/anco_hmos_data/cota/anco_dms/logicCamera/grlb 0755 system system",
        "restorecon /data/virt_service/anco_decoupling"
      ]
    },
    {
      "name": "services:rgm_manager",
      "cmds": [
        "mkdir /data/virt_service 0701 root root",
        "mkdir /data/virt_service/virt_comm 0701 root root",
        "mkdir /data/service/el1/public/rgm_manager 0770 rgm_manager rgm_manager",
        "restorecon /data/service/el1/public/rgm_manager",
        "mkdir /data/service/el1/public/rgm_manager/data 0770 rgm_manager rgm_manager",
        "restorecon /data/service/el1/public/rgm_manager/data",
        "mkdir /data/service/el1/public/rgm_manager/bridge_network 0700 rgm_manager rgm_manager",
        "restorecon /data/virt_service",
        "restorecon /data/virt_service/virt_comm",
        "mkdir /data/virt_service/virt_comm/rgm_hmos 0701 root root",
        "restorecon /data/virt_service/virt_comm/rgm_hmos",
        "mkdir /data/virt_service/virt_comm/rgm_hmos/uds 0701 root root",
        "restorecon /data/virt_service/virt_comm/rgm_hmos/uds",
        "mkdir /data/virt_service/virt_comm/rgm_hmos/uds/virt_ril 0710 radio radio",
        "restorecon /data/virt_service/virt_comm/rgm_hmos/uds/virt_ril",
        "mkdir /data/virt_service/rgm_linux 0701 root root",
        "restorecon /data/virt_service/rgm_linux",
        "mkdir /data/virt_service/virt_comm/rgm_linux 0701 root root",
        "restorecon /data/virt_service/virt_comm/rgm_linux",
        "mkdir /data/virt_service/virt_comm/rgm_linux/uds 0711 root root",
        "restorecon /data/virt_service/virt_comm/rgm_linux/uds"
      ]
    }
  ],
  "services": [
    {
      "name": "hmos_fusion_manager",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/hmos_fusion_manager.json"
      ],
      "start-mode": "condition",
      "ondemand": true,
      "sandbox": 0,
      "uid": "hmos_fusion_manager",
      "gid": [
        "hmos_fusion_manager",
        "media_rw",
        "system",
        "cache",
        "update"
      ],
      "secon": "u:r:ohos_hmos_fusion_manager:s0",
      "permission": [
        "ohos.permission.MANAGE_RGM",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.REBOOT",
        "ohos.permission.ACCESS_IDS",
        "ohos.permission.GET_BUNDLE_RESOURCES",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.GET_WIFI_INFO",
        "ohos.permission.ACCESS_LOWPOWER_MANAGER",
        "ohos.permission.RECEIVE_UPDATE_MESSAGE",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.sec.ACCESS_UDID",
        "ohos.permission.UPDATE_SYSTEM",
        "ohos.permission.UPDATE_MIGRATE",
        "ohos.permission.RECEIVE_APP_INSTALL_INFO_CHANGE",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.STORAGE_MANAGER_CRYPT",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.STORAGE_MANAGER"
      ],
      "permission_acls": [
        "ohos.permission.MANAGE_RGM",
        "ohos.permission.ACCESS_IDS",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.STORAGE_MANAGER_CRYPT"
      ],
      "jobs": {
        "on-start": "services:hmos_fusion_manager"
      }
    },
    {
      "name": "rgm_manager",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/rgm_manager.json"
      ],
      "uid": "rgm_manager",
      "gid": [
        "rgm_manager"
      ],
      "ondemand": true,
      "sandbox": 0,
      "apl": "system_basic",
      "secon": "u:r:ohos_containermgr_service:s0",
      "permission": [
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.ACCESS_CERT_MANAGER",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT"
      ],
      "jobs": {
        "on-start": "services:rgm_manager"
      }
    },
    {
      "name": "rgm_engine_plugin",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/rgm_engine_plugin.json"
      ],
      "uid": "root",
      "gid": [
        "root",
        "rgm_manager"
      ],
      "ondemand": true,
      "sandbox": 0,
      "apl": "system_basic",
      "secon": "u:r:ohos_container_engine_plugin_service:s0",
      "permission": [
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED"
      ]
    }
  ]
}
