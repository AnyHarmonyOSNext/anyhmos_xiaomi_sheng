{
  "jobs": [
    {
      "name": "services:sheng-ime",
      "cmds": [
        "mkdir /data/service/el1/public/imf 0711 inputmethod inputmethod"
      ]
    },
    {
      "name": "services:netsysnative",
      "cmds": [
        "mkdir /data/service/el1/public/netsysnative 0711 netsysnative netsysnative",
        "mount bpf bpf /sys/fs/bpf nodev",
        "mount cgroup2 none /sys/fs/cgroup nodev"
      ]
    },
    {
      "name": "services:netmanager",
      "cmds": [
        "mkdir /data/service/el1/public/netmanager 0711 net_manager net_manager",
        "mkdir /data/service/el1/public/netmanager/route 0711 net_manager net_manager",
        "mkdir /data/service/el1/public/hosts_user 0755 root root"
      ]
    },
    {
      "name": "param:sheng-platform-ime",
      "condition": "sheng.debug.start.ime=true",
      "cmds": [
        "start inputmethod_service"
      ]
    },
    {
      "name": "param:sheng-platform-netstack",
      "condition": "sheng.debug.start.netstack=true",
      "cmds": [
        "start netsysnative",
        "start netmanager"
      ]
    }
  ],
  "services": [
    {
      "name": "inputmethod_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/inputmethod_service.json"
      ],
      "uid": "inputmethod",
      "gid": [
        "inputmethod",
        "shell"
      ],
      "permission": [
        "ohos.permission.INPUT_MONITORING",
        "ohos.permission.GET_BUNDLE_INFO",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.CONNECT_INPUT_METHOD_EXTENSION",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.INPUT_PANEL_STATUS_PUBLISHER",
        "ohos.permission.RECEIVER_STARTUP_COMPLETED",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.GET_BUNDLE_RESOURCES",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.PRELOAD_APPLICATION",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS"
      ],
      "permission_acls": [
        "ohos.permission.INPUT_MONITORING"
      ],
      "caps": [],
      "secon": "u:r:inputmethod_service:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition",
      "jobs": {
        "on-start": "services:sheng-ime"
      }
    },
    {
      "name": "netsysnative",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/netsysnative.json"
      ],
      "uid": "netsysnative",
      "gid": [
        "netsysnative",
        "net_manager",
        "system",
        "shell",
        "root",
        "bluetooth",
        "netsys_socket",
        "dev_tun_access"
      ],
      "caps": [
        "CAP_NET_ADMIN",
        "CAP_NET_BIND_SERVICE",
        "CAP_NET_RAW",
        "CAP_SYS_ADMIN",
        "CAP_SYS_RESOURCE",
        "CAP_CHOWN",
        "CAP_FOWNER",
        "CAP_MKNOD"
      ],
      "jobs": {
        "on-start": "services:netsysnative"
      },
      "socket": [
        {
          "name": "dnsproxyd",
          "family": "AF_UNIX",
          "type": "SOCK_STREAM",
          "protocol": "default",
          "permissions": "0660",
          "uid": "netsysnative",
          "gid": "netsys_socket",
          "option": []
        },
        {
          "name": "fwmarkd",
          "family": "AF_UNIX",
          "type": "SOCK_STREAM",
          "protocol": "default",
          "permissions": "0660",
          "uid": "netsysnative",
          "gid": "netsys_socket",
          "option": []
        },
        {
          "name": "tunfd",
          "family": "AF_UNIX",
          "type": "SOCK_STREAM",
          "protocol": "default",
          "permissions": "0660",
          "uid": "netsysnative",
          "gid": "netsys_socket",
          "option": []
        },
        {
          "name": "multivpnfd",
          "family": "AF_UNIX",
          "type": "SOCK_STREAM",
          "protocol": "default",
          "permissions": "0660",
          "uid": "netsysnative",
          "gid": "netsys_socket",
          "option": []
        }
      ],
      "permission": [
        "ohos.permission.MANAGE_NET_STRATEGY",
        "ohos.permission.ACCESS_CERT_MANAGER",
        "ohos.permission.ACCESS_USER_TRUSTED_CERT",
        "ohos.permission.ACCESS_SYSTEM_APP_CERT"
      ],
      "permission_acls": [
        "ohos.permission.ACCESS_USER_TRUSTED_CERT",
        "ohos.permission.ACCESS_SYSTEM_APP_CERT"
      ],
      "secon": "u:r:netsysnative:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "netmanager",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/netmanager.json"
      ],
      "uid": "net_manager",
      "gid": [
        "net_manager",
        "system",
        "shell",
        "dhcp",
        "netsys_socket"
      ],
      "caps": [
        "CAP_NET_ADMIN",
        "CAP_NET_BIND_SERVICE",
        "CAP_NET_RAW"
      ],
      "jobs": {
        "on-start": "services:netmanager"
      },
      "permission": [
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.DISTRIBUTED_SOFTBUS_CENTER",
        "ohos.permission.ACCESS_SERVICE_DM",
        "ohos.permission.GET_WIFI_INFO",
        "ohos.permission.SET_WIFI_INFO",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.LOCATION",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.GET_NETWORK_STATS",
        "ohos.permission.ACCESS_PROTOCOL_DFX_STATE",
        "ohos.permission.ACCESS_BOOSTER_SERVICE",
        "ohos.permission.GET_BUNDLE_INFO",
        "ohos.permission.GET_BUNDLE_RESOURCES",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.MANAGE_BLUETOOTH",
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.SET_TELEPHONY_STATE",
        "ohos.permission.CONNECTIVITY_INTERNAL",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.MANAGE_WIFI_HOTSPOT",
        "ohos.permission.NETSYS_INTERNAL",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.GET_INSTALLED_BUNDLE_LIST",
        "ohos.permission.MANAGE_USB_CONFIG",
        "ohos.permission.ATTEST_KEY",
        "ohos.permission.CONNECT_VPN_EXTENSION",
        "ohos.permission.ACCESS_DISTRIBUTED_MODEM",
        "ohos.permission.NETWORK_DHCP",
        "ohos.permission.GET_SUSPEND_STATE",
        "ohos.permission.ACTIVITY_MOTION",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.RECEIVE_FUSION_MESSAGES",
        "ohos.permission.GET_WIFI_PEERS_MAC",
        "ohos.permission.START_RESTORE_NOTIFICATION",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.GET_WIFI_CONFIG",
        "ohos.permission.MANAGE_VPN",
        "ohos.permission.MANAGE_CAMERA_CONFIG"
      ],
      "permission_acls": [
        "ohos.permission.MANAGE_WIFI_HOTSPOT"
      ],
      "secon": "u:r:netmanager:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    }
  ]
}
