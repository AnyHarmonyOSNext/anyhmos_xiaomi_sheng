{
  "jobs": [
    {
      "name": "services:sheng-ime",
      "cmds": [
        "mkdir /data/service/el1/public/imf 0711 inputmethod inputmethod"
      ]
    },
    {
      "name": "services:netsysnative",
      "cmds": [
        "mkdir /data/service/el1/public/netsysnative 0711 netsysnative netsysnative",
        "mount bpf bpf /sys/fs/bpf nodev",
        "mount cgroup2 none /sys/fs/cgroup nodev"
      ]
    },
    {
      "name": "services:netmanager",
      "cmds": [
        "mkdir /data/service/el1/public/netmanager 0711 net_manager net_manager",
        "mkdir /data/service/el1/public/netmanager/route 0711 net_manager net_manager",
        "mkdir /data/service/el1/public/hosts_user 0755 root root"
      ]
    },
    {
      "name": "param:sheng-platform-ime",
      "condition": "sheng.debug.start.ime=true",
      "cmds": [
        "start inputmethod_service"
      ]
    },
    {
      "name": "param:sheng-platform-netstack",
      "condition": "sheng.debug.start.netstack=true",
      "cmds": [
        "start netsysnative",
        "start netmanager"
      ]
    },
    {
      "name": "services:faultloggerd",
      "cmds": [
        "mkdir /data/log 0775 system log",
        "mkdir /data/log/faultlog 0750 hiview log",
        "mkdir /data/log/faultlog/temp 0770 system system",
        "mkdir /data/log/faultlog/hilog 0750 logd log",
        "restorecon /dev/unix/socket/faultloggerd.server",
        "restorecon /dev/unix/socket/faultloggerd.crash.server"
      ]
    },
    {
      "name": "services:sheng-msdp-input",
      "cmds": [
        "mkdir /data/service/el1/public/msdp 0755 msdp msdp",
        "mkdir /data/service/el2/public/msdp 0755 msdp msdp"
      ]
    },
    {
      "name": "param:sheng-platform-diagnostics",
      "condition": "sheng.debug.start.diagnostics=true",
      "cmds": [
        "mkdir /data/log/eventlog 0771 system log",
        "mkdir /data/log/eventlog/freeze 0770 system system",
        "mkdir /data/log/faultlog 0750 hiview log",
        "mkdir /data/log/faultlog/faultlogger 0750 hiview log",
        "start faultloggerd"
      ]
    },
    {
      "name": "param:sheng-platform-uideps",
      "condition": "sheng.debug.start.uideps=true",
      "cmds": [
        "start pasteboard_service",
        "start msdp"
      ]
    },
    {
      "name": "param:sheng-codec",
      "condition": "sheng.debug.start.codec=true",
      "cmds": [
        "start av_codec_service"
      ]
    },
    {
      "name": "param:sheng-time",
      "condition": "sheng.debug.start.time=true",
      "cmds": [
        "mkdir /data/service/el1/public/time 0770 time time",
        "mkdir /data/service/el1/public/database/time 02770 time ddms",
        "syncexec /system/bin/chown -R time:time /data/service/el1/public/time",
        "start time_service"
      ]
    },
    {
      "name": "param:sheng-memmgr",
      "condition": "sheng.debug.start.memmgr=true",
      "cmds": [
        "mkdir /data/service/el1/public/memmgr",
        "chown memmgr memmgr /data/service/el1/public/memmgr",
        "chmod 0775 /data/service/el1/public/memmgr",
        "restorecon /data/service/el1/public/memmgr",
        "start memmgrservice"
      ]
    }
  ],
