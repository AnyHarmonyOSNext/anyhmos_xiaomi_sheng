{
  "jobs": [
    {
      "name": "services:wifi_manager_service",
      "cmds": [
        "mkdir /data/service/el1/public/dhcp 0770 dhcp dhcp",
        "mkdir /data/update/.netbak 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/cccs_grs 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/cccs_grs/router 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/cccs_grs/config 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/cccs_grs/cache 0770 wifi wifi",
        "copy /system/etc/wifi/grs_app_global_route_config.json /data/service/el1/public/wifi/cccs_grs/router/grs_app_global_route_config.json",
        "copy /system/etc/wifi/grs_sdk_server_config.json /data/service/el1/public/wifi/cccs_grs/config/grs_sdk_server_config.json",
        "chown wifi wifi /data/service/el1/public/wifi/cccs_grs/router/grs_app_global_route_config.json",
        "chown wifi wifi /data/service/el1/public/wifi/cccs_grs/router/grs_sdk_server_config.json",
        "mkdir /data/service/el2/public/wifi 0770 wifi wifi",
        "mkdir /data/service/el2/public/wifi/traj_match 0770 wifi wifi"
      ]
    },
    {
      "name": "param:sheng-wifi-v104",
      "condition": "sheng.debug.start.wifi=true",
      "cmds": [
        "mkdir /data/service/el1/public/wifi 0770 wifi wifi_group",
        "mkdir /data/service/el1/public/wifi/wpa_supplicant 0770 wifi wifi_group",
        "mkdir /data/service/el1/public/wifi/sockets 0770 wifi wifi_group",
        "mkdir /data/service/el1/public/dhcp 0770 dhcp dhcp",
        "start wifi_host",
        "start wpa_host",
        "start wifi_manager_service"
      ]
    }
  ],
  "services": [
    {
      "name": "wifi_manager_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/wifi_manager_service.json"
      ],
      "ondemand": true,
      "uid": "wifi",
      "gid": [
        "wifi",
        "shell",
        "dhcp",
        "oeminfo_nvme_server",
        "update",
        "netsys_socket",
        "radio",
        "dfs"
      ],
      "caps": [
        "CAP_NET_ADMIN",
        "CAP_NET_BIND_SERVICE",
        "CAP_NET_RAW"
      ],
      "jobs": {
        "on-start": "services:wifi_manager_service"
      },
      "apl": "system_basic",
      "permission": [
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.ACCESS_CERT_MANAGER",
        "ohos.permission.ACTIVITY_MOTION",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.MANAGE_VPN",
        "ohos.permission.MANAGE_NET_STRATEGY",
        "ohos.permission.INTERNET",
        "ohos.permission.GET_NETWORK_STATS",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.CONNECTIVITY_INTERNAL",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.ACCESS_BOOSTER_SERVICE",
        "ohos.permission.NETWORK_DHCP",
        "ohos.permission.APPROXIMATELY_LOCATION",
        "ohos.permission.LOCATION",
        "ohos.permission.LOCATION_IN_BACKGROUND",
        "ohos.permission.SET_WIFI_CONFIG",
        "ohos.permission.ACCESS_SYSTEM_SETTINGS",
        "ohos.permission.RECEIVER_STARTUP_COMPLETED",
        "ohos.permission.ACCESS_CMAP_SERVICE",
        "ohos.permission.ACCESS_SECURITY_PRIVACY_CENTER",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.QUERY_SECURITY_MODEL_RESULT",
        "ohos.permission.ACCELEROMETER",
        "ohos.permission.GYROSCOPE",
        "ohos.permission.ACCESS_SYSTEM_APP_CERT",
        "ohos.permission.ACCESS_PROTOCOL_DFX_STATE",
        "ohos.permission.ACCESS_HIVIEWCARE",
        "ohos.permission.ACCESS_NEARLINK",
        "ohos.permission.MANAGE_NEARLINK",
        "ohos.permission.GET_NEARLINK_PEER_MAC",
        "ohos.permission.GET_NEARLINK_LOCAL_MAC",
        "ohos.permission.SUBSCRIBE_NOTIFICATION_WINDOW_STATE",
        "ohos.permission.ACCESS_NEARLINK",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.RECEIVE_APP_INSTALL_INFO_CHANGE"
      ],
      "secon": "u:r:wifi_manager_service:s0",
      "once": 1,
      "sandbox": 0,
      "saspawn": false
    },
    {
      "name": "wifi_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "3",
        "-n",
        "wifi_host"
      ],
      "uid": "wifi_host",
      "gid": [
        "wifi_host",
        "wifi_group"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH",
        "NET_ADMIN",
        "NET_RAW"
      ],
      "secon": "u:r:wifi_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    },
    {
      "name": "wpa_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "4",
        "-n",
        "wpa_host"
      ],
      "uid": "wifi",
      "gid": [
        "wifi",
        "wifi_group",
        "wifi_host"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH",
        "NET_ADMIN",
        "NET_RAW"
      ],
      "secon": "u:r:wifi_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition",
      "permission": [
        "ohos.permission.ACCESS_CERT_MANAGER",
        "ohos.permission.ACCESS_SYSTEM_APP_CERT"
      ]
    }
  ]
}