{
  "jobs": [
    {
      "name": "param:sheng-hardware",
      "condition": "sheng.debug.start.hardware=true",
      "cmds": [
        "start powermgr"
      ]
    },
    {
      "name": "param:sheng-media",
      "condition": "sheng.debug.start.media=true",
      "cmds": [
        "start media_service",
        "start av_session"
      ]
    },
    {
      "name": "post-fs-data",
      "cmds": [
        "mkdir /data/service/el2/public/av_session 0760 av_session av_session",
        "mkdir /data/service/el2/public/av_session/cache 0760 av_session av_session"
      ]
    }
  ],
  "services": [
    {
      "name": "powermgr",
      "path": [
        "/compat/bin/native_brightness_launcher"
      ],
      "importance": -20,
      "once": 1,
      "uid": "powermgr",
      "apl": "system_core",
      "permission": [
        "ohos.permission.ACTIVITY_MOTION",
        "ohos.permission.INPUT_MONITORING",
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.DISTRIBUTED_SOFTBUS_CENTER",
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.MANAGE_AUDIO_CONFIG",
        "ohos.permission.WRITE_CALL_LOG",
        "ohos.permission.READ_CONTACTS",
        "ohos.permission.READ_DFX_SYSEVENT",
        "ohos.permission.GRANT_SENSITIVE_PERMISSIONS",
        "ohos.permission.REVOKE_SENSITIVE_PERMISSIONS",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
        "ohos.permission.ACCESS_SERVICE_DM",
        "ohos.permission.STORAGE_MANAGER",
        "ohos.permission.PROXY_AUTHORIZATION_URI",
        "ohos.permission.ABILITY_BACKGROUND_COMMUNICATION",
        "ohos.permission.USE_USER_IDM",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.LISTEN_BUNDLE_CHANGE",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.SEND_MESSAGES",
        "ohos.permission.CONNECT_CELLULAR_CALL_SERVICE",
        "ohos.permission.SET_TELEPHONY_STATE",
        "ohos.permission.VIBRATE",
        "ohos.permission.SYSTEM_LIGHT_CONTROL",
        "ohos.permission.MANAGE_HAP_TOKENID",
        "ohos.permission.WRITE_WHOLE_CALENDAR",
        "ohos.permission.UPDATE_CONFIGURATION",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.START_INVISIBLE_ABILITY",
        "ohos.permission.GET_BUNDLE_INFO",
        "ohos.permission.GET_SUSPEND_STATE",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.CLEAN_APPLICATION_DATA",
        "ohos.permission.REMOVE_CACHE_FILES",
        "ohos.permission.INSTALL_SANDBOX_BUNDLE",
        "ohos.permission.USE_BLUETOOTH",
        "ohos.permission.CONNECTIVITY_INTERNAL",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.GET_INSTALLED_BUNDLE_LIST",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS_EXTENSION",
        "ohos.permission.MANAGE_USER_ACCOUNT_INFO",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.MONITOR_DEVICE_NETWORK_STATE",
        "ohos.permission.POWER_OPTIMIZATION",
        "ohos.permission.ACCELEROMETER",
        "ohos.permission.MANAGE_USB_CONFIG"
      ],
      "gid": [
        "system",
        "shell"
      ],
      "caps": [
        "SYS_PTRACE",
        "KILL"
      ],
      "secon": "u:r:powermgr:s0",
      "disabled": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "media_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/media_service.json"
      ],
      "uid": "media",
      "gid": [
        "media_rw",
        "system",
        "netsys_socket",
        "graphics",
        "user_data_rw"
      ],
      "sandbox": 0,
      "apl": "system_core",
      "permission": [
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.MICROPHONE",
        "ohos.permission.CAPTURE_SCREEN",
        "ohos.permission.GET_BUNDLE_RESOURCES",
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.CAPTURE_VOICE_DOWNLINK_AUDIO",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.WRITE_IMAGEVIDEO",
        "ohos.permission.READ_IMAGEVIDEO",
        "ohos.permission.SET_UNREMOVABLE_NOTIFICATION",
        "ohos.permission.MANAGE_MISSIONS",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
        "ohos.permission.MANAGE_SETTINGS"
      ],
      "secon": "u:r:media_service:s0",
      "caps": [
        "CAP_CHOWN"
      ],
      "disabled": 1,
      "once": 1,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "av_session",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/av_session.json"
      ],
      "uid": "av_session",
      "gid": [
        "av_session",
        "access_token"
      ],
      "apl": "system_core",
      "permission": [
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.ACCESS_SERVICE_DM",
        "ohos.permission.ACCESS_CAST_ENGINE_MIRROR",
        "ohos.permission.ACCESS_CAST_ENGINE_STREAM",
        "ohos.permission.ABILITY_BACKGROUND_COMMUNICATION",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.EXECUTE_INSIGHT_INTENT",
        "ohos.permission.DISTRIBUTED_SOFTBUS_CENTER",
        "ohos.permission.LISTEN_BUNDLE_CHANGE",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.USE_BLUETOOTH",
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.MANAGE_MEDIA_RESOURCES",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.RECEIVER_STARTUP_COMPLETED",
        "ohos.permission.GET_BUNDLE_RESOURCES",
        "ohos.permission.MONITOR_DEVICE_NETWORK_STATE",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT"
      ],
      "secon": "u:r:av_session:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    }
  ]
}
