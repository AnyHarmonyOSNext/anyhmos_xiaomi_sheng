{
  "jobs": [
    {
      "name": "sheng-storaged-data",
      "cmds": [
        "mkdir /mnt/data 0755 root root",
        "mkdir /data/service/el1/public/storage_daemon 0755 root root",
        "mkdir /mnt/data/external 0755 root file_manager",
        "mkdir /mnt/data/dvr 0751 root file_manager",
        "mkdir /mnt/data/external_fuse 0751 root file_manager",
        "mkdir /mnt/data/voldata 0751 root file_manager",
        "mkdir /data/service/el1/public/storage_daemon/radar 0640 root root",
        "mkdir /data/local/mtp_tmp 1770 system system"
      ]
    },
    {
      "name": "param:sheng-debug-storaged",
      "condition": "sheng.debug.start.storaged=true",
      "cmds": [
        "trigger sheng-storaged-data",
        "start storage_daemon"
      ]
    },
    {
      "name": "sheng-storage-data",
      "cmds": [
        "mkdir /data/service/el1/public/storage_manager 0755 1090 1090",
        "mkdir /data/service/el1/public/storage_manager/database 0755 1090 1090"
      ]
    },
    {
      "name": "param:sheng-debug-storage",
      "condition": "sheng.debug.start.storage=true",
      "cmds": [
        "trigger sheng-storage-data",
        "start storage_manager"
      ]
    },
    {
      "name": "sheng-kvdata-data",
      "cmds": [
        "mkdir /data/service/el1/public/database 0711 ddms ddms",
        "mkdir /data/service/el1/public/database/distributeddata 02770 ddms ddms",
        "mkdir /data/service/el1/public/database/distributeddata/meta 02770 ddms ddms",
        "mkdir /data/service/el1/public/database/distributeddata/meta/backup 02770 ddms ddms",
        "mkdir /data/service/el1/public/database/distributeddata/kvdb 02770 ddms ddms",
        "mkdir /data/service/el1/public/database/distributeddata/rdb 02770 ddms ddms"
      ]
    },
    {
      "name": "param:sheng-debug-kvdata",
      "condition": "sheng.debug.start.kvdata=true",
      "cmds": [
        "trigger sheng-kvdata-data",
        "start distributeddata"
      ]
    },
    {
      "name": "param:sheng-init-main-user",
      "condition": "sheng.debug.init.mainuser=true",
      "cmds": [
        "exec /system/bin/sdc filecrypt init_main_user"
      ]
    },
    {
      "name": "param:sheng-debug-theme",
      "condition": "sheng.debug.start.theme=true",
      "cmds": [
        "mkdir /data/service/el1/public/themes 0775 wallpaper wallpaper",
        "mkdir /data/service/el1/public/themes/container/ 0775 wallpaper wallpaper",
        "mkdir /data/service/el1/public/themes/container/fonts/ 0775 wallpaper wallpaper",
        "start theme_manager_service"
      ]
    },
    {
      "name": "param:sheng-debug-wallpaper",
      "condition": "sheng.debug.start.wallpaper=true",
      "cmds": [
        "mkdir /data/service/el1/public/wallpaper 0770 wallpaper wallpaper",
        "start wallpaper_service"
      ]
    },
    {
      "name": "services:wifi_manager_service",
      "cmds": [
        "mkdir /data/update 0771 root root",
        "mkdir /data/service/el1/public/wifi 0770 wifi wifi",
        "mkdir /data/service/el2/public/wifi 0770 wifi wifi",
        "mkdir /data/service/el1/public/dhcp 0770 dhcp dhcp",
        "mkdir /data/update/.netbak 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/cccs_grs 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/cccs_grs/router 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/cccs_grs/config 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/cccs_grs/cache 0770 wifi wifi",
        "copy /system/etc/wifi/grs_app_global_route_config.json /data/service/el1/public/wifi/cccs_grs/router/grs_app_global_route_config.json",
        "copy /system/etc/wifi/grs_sdk_server_config.json /data/service/el1/public/wifi/cccs_grs/config/grs_sdk_server_config.json",
        "chown wifi wifi /data/service/el1/public/wifi/cccs_grs/router/grs_app_global_route_config.json",
        "chown wifi wifi /data/service/el1/public/wifi/cccs_grs/router/grs_sdk_server_config.json",
        "mkdir /data/service/el2/public/wifi 0770 wifi wifi",
        "mkdir /data/service/el2/public/wifi/traj_match 0770 wifi wifi"
      ]
    },
    {
      "name": "param:sheng-debug-wifi-state",
      "condition": "sheng.debug.start.wifi=true",
      "cmds": [
        "start wifi_manager_service"
      ]
    }
  ],
  "services": [
    {
      "name": "storage_daemon",
      "path": [
        "/compat/bin/storage-ram-launcher"
      ],
      "disabled": 1,
      "uid": "root",
      "gid": [
        "root"
      ],
      "sandbox": 0,
      "start-mode": "condition",
      "secon": "u:r:storage_daemon:s0",
      "permission": [
        "ohos.permission.STORAGE_MANAGER",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.USE_USER_IDM",
        "ohos.permission.ACCESS_SCREEN_LOCK",
        "ohos.permission.ACCESS_SCREEN_LOCK_INNER",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT"
      ],
      "permission_acls": [
        "ohos.permission.ACCESS_SCREEN_LOCK_INNER"
      ],
      "once": 1,
      "saspawn": false
    },
    {
      "name": "storage_manager",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/storage_manager.json"
      ],
      "uid": "storage_manager",
      "gid": [
        "storage_manager"
      ],
      "sandbox": 0,
      "start-mode": "condition",
      "secon": "u:r:storage_manager:s0",
      "apl": "system_basic",
      "permission": [
        "ohos.permission.READ_MEDIA",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.ACCESS_SCREEN_LOCK",
        "ohos.permission.ACCESS_SCREEN_LOCK_INNER",
        "ohos.permission.REMOVE_CACHE_FILES",
        "ohos.permission.MANAGE_LOCAL_WORKSPACES",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.GET_INSTALLED_BUNDLE_LIST",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.REPORT_SECURITY_EVENT",
        "ohos.permission.STORAGE_MANAGER"
      ],
      "permission_acls": [
        "ohos.permission.ACCESS_SCREEN_LOCK_INNER"
      ],
      "disabled": 1,
      "once": 1,
      "saspawn": false
    },
    {
      "name": "distributeddata",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/distributeddata.json"
      ],
      "uid": "ddms",
      "gid": [
        "system",
        "shell",
        "readproc",
        "ddms",
        "dfs_share",
        "data_reserve"
      ],
      "secon": "u:r:distributeddata:s0",
      "apl": "system_basic",
      "sandbox": 0,
      "permission": [
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.ACCESS_SERVICE_DM",
        "ohos.permission.PROXY_AUTHORIZATION_URI",
        "ohos.permission.CLOUDFILE_SYNC",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.GET_BUNDLE_INFO",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.DISTRIBUTED_SOFTBUS_CENTER",
        "ohos.permission.MONITOR_DEVICE_NETWORK_STATE",
        "ohos.permission.USE_CLOUD_DRIVE_SERVICE",
        "ohos.permission.GRANT_URI_PERMISSION_PRIVILEGED",
        "ohos.permission.RECEIVE_UPDATE_MESSAGE",
        "ohos.permission.ACCESS_EXT_SYSTEM_ABILITY"
      ],
      "permission_acls": [
        "ohos.permission.MONITOR_DEVICE_NETWORK_STATE",
        "ohos.permission.GRANT_URI_PERMISSION_PRIVILEGED",
        "ohos.permission.ACCESS_EXT_SYSTEM_ABILITY"
      ],
      "disabled": 1,
      "once": 1,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "theme_manager_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/theme_manager_service.json"
      ],
      "uid": "wallpaper",
      "gid": [
        "wallpaper",
        "shell",
        "oeminfo_nvme_server"
      ],
      "permission": [
        "ohos.permission.UPDATE_CONFIGURATION",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.ACTIVATE_THEME_PACKAGE"
      ],
      "secon": "u:r:theme_manager_service:s0",
      "disabled": 1,
      "once": 1,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "wallpaper_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/wallpaper_service.json"
      ],
      "uid": "wallpaper",
      "gid": [
        "wallpaper",
        "shell"
      ],
      "permission": [
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.ACTIVATE_THEME_PACKAGE",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.CONNECT_WALLPAPER_EXTENSION",
        "ohos.permission.GET_WALLPAPER"
      ],
      "secon": "u:r:wallpaper_service:s0",
      "disabled": 1,
      "once": 1,
      "saspawn": false,
      "start-mode": "condition"
    },
    {
      "name": "wifi_manager_service",
      "disabled": 1,
      "path": [
        "/system/bin/sa_main",
        "/system/profile/wifi_manager_service.json"
      ],
      "ondemand": true,
      "uid": "wifi",
      "gid": [
        "wifi",
        "shell",
        "dhcp",
        "oeminfo_nvme_server",
        "update",
        "netsys_socket",
        "radio",
        "dfs"
      ],
      "caps": [
        "CAP_NET_ADMIN",
        "CAP_NET_BIND_SERVICE",
        "CAP_NET_RAW"
      ],
      "jobs": {
        "on-start": "services:wifi_manager_service"
      },
      "apl": "system_basic",
      "permission": [
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.ACCESS_CERT_MANAGER",
        "ohos.permission.ACTIVITY_MOTION",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.MANAGE_VPN",
        "ohos.permission.MANAGE_NET_STRATEGY",
        "ohos.permission.INTERNET",
        "ohos.permission.GET_NETWORK_STATS",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.CONNECTIVITY_INTERNAL",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.ACCESS_BOOSTER_SERVICE",
        "ohos.permission.NETWORK_DHCP",
        "ohos.permission.APPROXIMATELY_LOCATION",
        "ohos.permission.LOCATION",
        "ohos.permission.LOCATION_IN_BACKGROUND",
        "ohos.permission.SET_WIFI_CONFIG",
        "ohos.permission.ACCESS_SYSTEM_SETTINGS",
        "ohos.permission.RECEIVER_STARTUP_COMPLETED",
        "ohos.permission.ACCESS_CMAP_SERVICE",
        "ohos.permission.ACCESS_SECURITY_PRIVACY_CENTER",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.QUERY_SECURITY_MODEL_RESULT",
        "ohos.permission.ACCELEROMETER",
        "ohos.permission.GYROSCOPE",
        "ohos.permission.ACCESS_SYSTEM_APP_CERT",
        "ohos.permission.ACCESS_PROTOCOL_DFX_STATE",
        "ohos.permission.ACCESS_HIVIEWCARE",
        "ohos.permission.ACCESS_NEARLINK",
        "ohos.permission.MANAGE_NEARLINK",
        "ohos.permission.GET_NEARLINK_PEER_MAC",
        "ohos.permission.GET_NEARLINK_LOCAL_MAC",
        "ohos.permission.SUBSCRIBE_NOTIFICATION_WINDOW_STATE",
        "ohos.permission.ACCESS_NEARLINK",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.RECEIVE_APP_INSTALL_INFO_CHANGE"
      ],
      "secon": "u:r:wifi_manager_service:s0",
      "once": 1,
      "saspawn": false
    }
  ]
}
