{
  "import": [],
  "jobs": [
    {
      "name": "pre-init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_PRE_INIT",
        "mkdir /data/service/el0/access_token 0750 root access_token",
        "load_access_token_id ",
        "load_persist_params ",
        "mkdir /data/log/ 0775 system log",
        "mkdir /data/log/dict/ 0755 logd log",
        "mkdir /data/log/hilog/ 0755 logd log",
        "write /proc/sys/net/unix/max_dgram_qlen 600",
        "start hilogd"
      ]
    },
    {
      "name": "init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_INIT",
        "mkdir /data/samgr 0740 samgr samgr"
      ]
    },
    {
      "name": "post-init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_POST_INIT",
        "start samgr",
        "start hdf_devmgr",
        "start allocator_host",
        "start composer_host",
        "write /dev/kmsg HMOS_CORE_START_DONE"
      ]
    }
  ],
  "services": [
    {
      "name": "samgr",
      "path": [
        "/system/bin/samgr"
      ],
      "uid": "samgr",
      "gid": [
        "samgr",
        "system",
        "readproc",
        "data_reserve"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "file": [
        "/dev/kmsg rd 0660 root system"
      ],
      "secon": "u:r:samgr:s0"
    },
    {
      "name": "hilogd",
      "path": [
        "/system/bin/hilogd"
      ],
      "disabled": 1,
      "uid": "logd",
      "gid": [
        "log",
        "system",
        "readproc",
        "shell",
        "servicectrl"
      ],
      "sandbox": 0,
      "file": [
        "/dev/kmsg rd 0660 root system"
      ],
      "permission": [
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT"
      ],
      "socket": [
        {
          "name": "hilogInput",
          "family": "AF_UNIX",
          "type": "SOCK_DGRAM",
          "protocol": "default",
          "permissions": "0222",
          "uid": "logd",
          "gid": "log",
          "option": [
            "SOCKET_OPTION_PASSCRED"
          ]
        },
        {
          "name": "hilogOutput",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0666",
          "uid": "logd",
          "gid": "log",
          "option": [
            "SOCKET_OPTION_PASSCRED"
          ]
        },
        {
          "name": "hilogControl",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0660",
          "uid": "logd",
          "gid": "log",
          "option": []
        },
        {
          "name": "hilogControlPub",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0666",
          "uid": "logd",
          "gid": "log",
          "option": []
        }
      ],
      "start-mode": "condition",
      "secon": "u:r:hilogd:s0",
      "once": 1
    },
    {
      "name": "hdf_devmgr",
      "path": [
        "/system/bin/hdf_devmgr"
      ],
      "uid": "hdf_devmgr",
      "gid": [
        "hdf_devmgr",
        "readproc",
        "uhdf_driver",
        "data_reserve"
      ],
      "start-mode": "boot",
      "secon": "u:r:hdf_devmgr:s0",
      "bootevents": [
        "bootevent.hdf_devmgr.ready"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0
    },
    {
      "name": "allocator_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "0",
        "-n",
        "allocator_host"
      ],
      "uid": "allocator_host",
      "gid": [
        "allocator_host",
        "graphics",
        "dev_dma_heap"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:allocator_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0
    },
    {
      "name": "composer_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "1",
        "-n",
        "composer_host",
        "-p",
        "-8",
        "-s",
        "2"
      ],
      "uid": "composer_host",
      "gid": [
        "composer_host",
        "graphics",
        "dev_dma_heap",
        "dev_memory",
        "dev_lcd_backlight",
        "oeminfo_nvme_server"
      ],
      "caps": [
        "SYS_NICE",
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:composer_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0
    }
  ]
}
