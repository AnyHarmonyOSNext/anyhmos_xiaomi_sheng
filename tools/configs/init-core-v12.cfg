{
  "import": [],
  "jobs": [
    {
      "name": "pre-init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_PRE_INIT",
        "mkdir /data/service/el0/access_token 0750 root access_token",
        "load_access_token_id ",
        "load_persist_params "
      ]
    },
    {
      "name": "init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_INIT",
        "mkdir /data/samgr 0740 samgr samgr"
      ]
    },
    {
      "name": "post-init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_POST_INIT",
        "start samgr"
      ]
    }
  ],
  "services": [
    {
      "name": "samgr",
      "path": ["/system/bin/samgr"],
      "uid": "samgr",
      "gid": ["samgr", "system", "readproc", "data_reserve"],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "file": ["/dev/kmsg rd 0660 root system"],
      "secon": "u:r:samgr:s0"
    }
  ]
}
