{
  "import": [],
  "jobs": [
    {
      "name": "pre-init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_PRE_INIT",
        "mkdir /data/service/el0/access_token 0750 root access_token",
        "load_access_token_id ",
        "load_persist_params ",
        "mkdir /data/log/ 0775 system log",
        "mkdir /data/log/dict/ 0755 logd log",
        "mkdir /data/log/hilog/ 0755 logd log",
        "write /proc/sys/net/unix/max_dgram_qlen 600",
        "start hilogd"
      ]
    },
    {
      "name": "init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_INIT",
        "mkdir /data/samgr 0740 samgr samgr"
      ]
    },
    {
      "name": "post-init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_POST_INIT",
        "start samgr",
        "write /dev/kmsg HMOS_CORE_START_DONE"
      ]
    },
    {
      "name": "param:sheng-start-hdf",
      "condition": "bootevent.samgr.ready=true",
      "cmds": [
        "start hdf_devmgr"
      ]
    },
    {
      "name": "param:sheng-start-graphics",
      "condition": "bootevent.hdf_devmgr.ready=true",
      "cmds": [
        "start allocator_host",
        "start composer_host"
      ]
    },
    {
      "name": "sheng-render-init",
      "cmds": [
        "mkdir /data/service/el0/render_service 0711 graphics graphics",
        "mkdir /data/system 0771 system system",
        "mkdir /data/system/RTShaderCache 0770 system system",
        "mkdir /data/local 0751 root root",
        "mkdir /data/local/shader_cache 0711 root root",
        "mkdir /data/local/shader_cache/local 0711 root root",
        "mkdir /data/local/shader_cache/local/system 0771 system system",
        "mkdir /data/local/shader_cache/local/system/RenderProfiler 0771 graphics system",
        "mkdir /data/local/shader_cache/local/system/RenderProfiler/common 0771 graphics system",
        "mkdir /data/local/shader_cache/local/system/RenderProfiler/rs 0771 graphics system",
        "mkdir /data/local/shader_cache/local/system/RenderProfiler/trace3d 0771 graphics system"
      ]
    },
    {
      "name": "sheng-render-post-fs-data",
      "cmds": [
        "mkdir /data/app/el1/public 0711 root root",
        "mkdir /data/app/el1/public/shader_cache 0711 root root",
        "mkdir /data/app/el1/public/shader_cache/cloud 02771 root app_install",
        "mkdir /data/app/el1/public/shader_cache/cloud/common 02775 root app_install",
        "mkdir /data/service/el1/public 0711 root root",
        "mkdir /data/service/el1/public/shader_cache 0771 system system",
        "mkdir /data/service/el1/public/shader_cache/local 0771 system system",
        "mkdir /data/service/el1/public/shader_cache/local/render_service 0771 graphics system"
      ]
    },
    {
      "name": "param:sheng-debug-coredeps",
      "condition": "sheng.debug.start.coredeps=true",
      "cmds": [
        "start param_watcher",
        "start concurrent_task_service"
      ]
    },
    {
      "name": "param:sheng-debug-render",
      "condition": "sheng.debug.start.render=true",
      "cmds": [
        "trigger sheng-render-init",
        "trigger sheng-render-post-fs-data",
        "setparam persist.rosen.disableddgr.enabled 1",
        "start render_service"
      ]
    }
  ],
  "services": [
    {
      "name": "samgr",
      "path": [
        "/system/bin/samgr"
      ],
      "uid": "samgr",
      "gid": [
        "samgr",
        "system",
        "readproc",
        "data_reserve"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "file": [
        "/dev/kmsg rd 0660 root system"
      ],
      "secon": "u:r:samgr:s0",
      "start-mode": "condition"
    },
    {
      "name": "hilogd",
      "path": [
        "/system/bin/hilogd"
      ],
      "disabled": 1,
      "uid": "logd",
      "gid": [
        "log",
        "system",
        "readproc",
        "shell",
        "servicectrl"
      ],
      "sandbox": 0,
      "file": [
        "/dev/kmsg rd 0660 root system"
      ],
      "permission": [
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT"
      ],
      "socket": [
        {
          "name": "hilogInput",
          "family": "AF_UNIX",
          "type": "SOCK_DGRAM",
          "protocol": "default",
          "permissions": "0222",
          "uid": "logd",
          "gid": "log",
          "option": [
            "SOCKET_OPTION_PASSCRED"
          ]
        },
        {
          "name": "hilogOutput",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0666",
          "uid": "logd",
          "gid": "log",
          "option": [
            "SOCKET_OPTION_PASSCRED"
          ]
        },
        {
          "name": "hilogControl",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0660",
          "uid": "logd",
          "gid": "log",
          "option": []
        },
        {
          "name": "hilogControlPub",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0666",
          "uid": "logd",
          "gid": "log",
          "option": []
        }
      ],
      "start-mode": "condition",
      "secon": "u:r:hilogd:s0",
      "once": 1
    },
    {
      "name": "hdf_devmgr",
      "path": [
        "/system/bin/hdf_devmgr"
      ],
      "uid": "hdf_devmgr",
      "gid": [
        "hdf_devmgr",
        "readproc",
        "uhdf_driver",
        "data_reserve"
      ],
      "start-mode": "condition",
      "secon": "u:r:hdf_devmgr:s0",
      "bootevents": [
        "bootevent.hdf_devmgr.ready"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0
    },
    {
      "name": "allocator_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "0",
        "-n",
        "allocator_host"
      ],
      "uid": "allocator_host",
      "gid": [
        "allocator_host",
        "graphics",
        "dev_dma_heap"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:allocator_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    },
    {
      "name": "composer_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "1",
        "-n",
        "composer_host",
        "-p",
        "-8",
        "-s",
        "2"
      ],
      "uid": "composer_host",
      "gid": [
        "composer_host",
        "graphics",
        "dev_dma_heap",
        "dev_memory",
        "dev_lcd_backlight",
        "oeminfo_nvme_server"
      ],
      "caps": [
        "SYS_NICE",
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:composer_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    },
    {
      "name": "param_watcher",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/param_watcher.json"
      ],
      "uid": "paramwatcher",
      "start-mode": "condition",
      "saspawn": false,
      "gid": [
        "paramwatcher",
        "shell"
      ],
      "secon": "u:r:param_watcher:s0",
      "bootevents": "bootevent.param_watcher.started",
      "disabled": 1,
      "once": 1,
      "sandbox": 0
    },
    {
      "name": "concurrent_task_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/concurrent_task_service.json"
      ],
      "importance": -20,
      "uid": "system",
      "gid": [
        "system",
        "shell"
      ],
      "bootevents": [
        "bootevent.concurrentTaskService.ready"
      ],
      "secon": "u:r:concurrent_task_service:s0",
      "permission": [
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.READ_HIVIEW_SYSTEM",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS"
      ],
      "disabled": 1,
      "once": 1,
      "start-mode": "condition",
      "sandbox": 0
    },
    {
      "name": "render_service",
      "path": [
        "/system/bin/render_service"
      ],
      "importance": -20,
      "uid": "graphics",
      "gid": [
        "system",
        "tp_host",
        "data_reserve",
        "dev_dma_heap",
        "composer_host",
        "graphics"
      ],
      "caps": [
        "SYS_NICE"
      ],
      "bootevents": [
        "bootevent.renderservice.ready"
      ],
      "permission": [
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.KILL_APP_PROCESSES",
        "ohos.permission.RECEIVE_UPDATE_MESSAGE"
      ],
      "secon": "u:r:render_service:s0",
      "once": 1,
      "disabled": 1,
      "start-mode": "condition",
      "sandbox": 0
    }
  ]
}
